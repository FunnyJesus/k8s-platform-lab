apiVersion: v1
kind: Pod
metadata:
  name: {{ include "my-app.fullname" . }}-test
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["/bin/sh", "-ec"]
      args:
        - |
          HOST=http://{{ include "my-app.fullname" . }}:{{ .Values.service.port }}
          curl -fsS -o /dev/null -w '%{http_code}\n' $HOST/healthz | grep -qx 200
          curl -fsS -o /dev/null -w '%{http_code}\n' $HOST/readyz  | grep -qx 200
          curl -fsS $HOST/metrics | grep -q '^app_ready '
          curl -fsS $HOST/metrics | grep -q 'http_request_duration_seconds_bucket'
          curl -fsS $HOST/ | grep -q '"version"'