{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "my-app.fullname" . }}-dashboard
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    grafana_dashboard: "1"       # по этому лейблу sidecar Grafana забирает дашборд
data:
  app-overview.json: |
{{ .Files.Get "dashboards/app-overview.json" | indent 4 }}
{{- end }}