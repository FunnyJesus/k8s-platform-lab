apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-app-rules
  labels:
    release: kps
spec:
  groups:
    - name: my-app.slo
      interval: 30s
      rules:
        - alert: AppHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="my-app"}[5m]))) > 0.2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "p95 выше SLO 200ms"
            description: "p95 = {{ $value }}s за последние 5 минут."

        - alert: AppNotReady
          expr: sum(app_ready{namespace="my-app"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Ни одна реплика не готова принимать трафик"

        - alert: AppMetricsAbsent
          expr: absent(app_ready{namespace="my-app"})
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Метрики приложения не собираются"
            description: "Таргет пропал: под удалён, Service сломан или ServiceMonitor не подхвачен."

        - alert: AppHighErrorRate
          expr: (sum(rate(http_requests_total{namespace="my-app",status=~"5.."}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{namespace="my-app"}[5m])), 0.001) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Более 5% ответов — 5xx"

        - alert: PodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total{namespace="my-app"}[15m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Под перезапускается чаще трёх раз за 15 минут"