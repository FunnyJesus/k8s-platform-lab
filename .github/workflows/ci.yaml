name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: make lint
  e2e:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
        with: 
          install_only: true
      - run: make cluster CLUSTER_CONFIG=configs/cluster-ci.yaml
      - run: make ingress
      - run: make metrics
      - run: make deploy
      - run: make test
      - run: curl -fsS http://localhost/ | grep -q '"version"'